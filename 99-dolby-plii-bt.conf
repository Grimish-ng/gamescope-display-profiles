            filter.graph = {
                nodes = [
                    { type = builtin name = fc_copy  label = copy }
                    { type = builtin name = lfe_copy label = copy }
                    { type = builtin name = sl_phased label = convolver
                      config = { filename = /hilbert length = 90 } }
                    { type = builtin name = sr_phased label = convolver
                      config = { filename = /hilbert length = 90 } }
                    { type = builtin name = mixer_lt label = mixer
                      control = {
                          "Gain 1" =  1.0
                          "Gain 2" =  0.0
                          "Gain 3" =  0.7071067811865475
                          "Gain 4" =  0.7071067811865475
                          "Gain 5" = -0.8660254037844386
                          "Gain 6" = -0.5
                      } }
                    { type = builtin name = mixer_rt label = mixer
                      control = {
                          "Gain 1" = 0.0
                          "Gain 2" = 1.0
                          "Gain 3" = 0.7071067811865475
                          "Gain 4" = 0.7071067811865475
                          "Gain 5" = 0.5
                          "Gain 6" = 0.8660254037844386
                      } }
                ]
                links = [
                    { output = "fc_copy:Out"   input = "mixer_lt:In 3" }
                    { output = "fc_copy:Out"   input = "mixer_rt:In 3" }
                    { output = "lfe_copy:Out"  input = "mixer_lt:In 4" }
                    { output = "lfe_copy:Out"  input = "mixer_rt:In 4" }
                    { output = "sl_phased:Out" input = "mixer_lt:In 5" }
