                    { output = "sr_phased:Out" input = "mixer_lt:In 6" }
                    { output = "sr_phased:Out" input = "mixer_rt:In 6" }
                ]
                inputs  = [ "mixer_lt:In 1" "mixer_rt:In 2" "fc_copy:In" "lfe_copy:In" "sl_phased:In" "sr_phased:In" ]
                outputs = [ "mixer_lt:Out" "mixer_rt:Out" ]
            }
            capture.props = {
                node.name        = Dolby-Pro-Logic-II-BT
                node.description = "5.1 Surround (Dolby Pro Logic II) BT"
                media.class      = Audio/Sink
                audio.channels   = 6
                audio.position   = [ FL FR FC LFE SL SR ]
            }
            playback.props = {
                node.name          = Dolby-Pro-Logic-II-BT-Output
                node.passive       = true
                node.dont-fallback = true
                node.dont-move     = true
                audio.channels     = 2
                audio.position     = [ FL FR ]
                target.object      = bluez_output.C4_1C_FF_3E_25_EE.1
